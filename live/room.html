<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sala en Vivo - Academia Addison</title>
<link rel="stylesheet" href="css/live.css"/>
<!-- === CORE DEPENDENCIES - NO MODIFICAR VERSIONES === -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<!-- === LIVE APP - ESTRUCTURA PRINCIPAL - NO CAMBIAR IDs === -->
<div class="live-app" id="liveApp">
  <!-- STAGE: Video principal o pizarra -->
  <div class="stage-container">
    <!-- Video Stage -->
    <div class="video-stage" id="videoStage">
      <video id="mainVideo" autoplay playsinline></video>
      <div class="stage-label" id="stageLabel">Academia Addison</div>
    </div>
    <!-- Whiteboard Stage -->
    <div class="whiteboard-stage hidden" id="whiteboardStage">
      <canvas id="whiteboard"></canvas>
      <div class="grid-overlay"></div>
      <!-- Paleta de colores - Identidad Addison -->
      <div class="palette">
        <button class="color-dot active" data-color="#FF3B5C" style="background:#FF3B5C" title="Addison Red"></button>
        <button class="color-dot" data-color="#FF8FA8" style="background:#FF8FA8"></button>
        <button class="color-dot" data-color="#FFEB3B" style="background:#FFEB3B"></button>
        <button class="color-dot" data-color="#2196F3" style="background:#2196F3"></button>
        <button class="color-dot" data-color="#4CAF50" style="background:#4CAF50"></button>
        <button class="color-dot" data-color="#FFFFFF" style="background:#fff;border:1px solid #444"></button>
      </div>
      <!-- Herramientas -->
      <div class="tools">
        <button class="tool-btn active" data-tool="pen" title="Lápiz">✏️</button>
        <button class="tool-btn" data-tool="eraser" title="Borrador">🧽</button>
        <button class="tool-btn" data-tool="clear" title="Limpiar">🗑️</button>
      </div>
    </div>
    <!-- Active Speaker Indicator -->
    <div class="active-speaker hidden" id="activeSpeaker">
      <span id="speakerName">Hablando...</span>
      <button id="pinSpeaker">Fijar</button>
    </div>
  </div>

  <!-- SIDE PANEL: Participantes y Chat -->
  <aside class="side-panel" id="sidePanel">
    <div class="panel-section participants">
      <div class="panel-header">
        <span>Participantes</span>
        <span id="participantCount">0</span>
      </div>
      <div class="participant-list" id="participantList"></div>
    </div>
    <div class="panel-section chat">
      <div class="panel-header">
        <span>Chat en vivo</span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input">
        <input id="chatInput" type="text" placeholder="Escribe un mensaje..." maxlength="200"/>
        <button id="sendChat">➤</button>
      </div>
    </div>
  </aside>

  <!-- CONTROLS BAR -->
  <div class="controls-bar">
    <div class="controls-left">
      <button id="btnMic" class="ctrl-btn active" title="Micrófono">🎤</button>
      <button id="btnCam" class="ctrl-btn active" title="Cámara">📷</button>
      <button id="btnScreen" class="ctrl-btn" title="Compartir pantalla">🖥️</button>
      <button id="btnBoard" class="ctrl-btn" title="Pizarra">📝</button>
      <button id="btnHand" class="ctrl-btn" title="Levantar mano">✋</button>
    </div>
    <div class="controls-center" id="liveStatus">
      <span class="live-dot"></span>
      <span id="liveCourseName">Conectando...</span>
    </div>
    <div class="controls-right">
      <button id="btnParticipants" class="ctrl-btn" title="Participantes">👥</button>
      <button id="btnChat" class="ctrl-btn" title="Chat">💬</button>
      <button id="btnReactions" class="ctrl-btn" title="Reacciones">😊</button>
      <button id="btnExit" class="ctrl-btn leave">Salir</button>
      <button id="btnEndLive" class="ctrl-btn leave hidden">Finalizar</button>
    </div>
  </div>
</div>

<!-- Reactions Layer -->
<div class="reactions-layer" id="reactionsLayer"></div>

<!-- Hidden video grid for thumbnails -->
<div id="videoGrid" class="hidden"></div>
<video id="localVideo" autoplay muted playsinline class="hidden"></video>

<script type="module" src="js/live-room.js"></script>
</body>
</html>
