<!--
=================================================================
ACADEMIA VIRTUAL ADDISON - VERSIÓN COMENTADA
-----------------------------------------------------------------
Este archivo es el mismo index.html original pero con comentarios
explicativos añadidos para que una persona sin experiencia pueda
entender qué hace cada parte y cómo editarla de forma segura.
=================================================================
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Academia Virtual Addison</title>

  <link rel="stylesheet" href="css/platform.css">
</head>
<body>

<!-- ==================== PANTALLA DE BIENVENIDA / LOGIN ==================== -->
<!-- Esta sección se muestra primero. Izquierda: branding. Derecha: formulario de ingreso. -->
<section id="welcome">
  <div class="welcome-left">
    <h1>Prepárate con los mejores</h1>
    <p>Academia preuniversitaria virtual Addison. Entra y empieza a estudiar ahora.</p>
  </div>
  <div class="welcome-right">
    <form class="login-card" id="loginForm" novalidate>
      <h2>Ingresar</h2>
      <div class="sub">Acceso rápido para estudiar</div>
      <div class="field" id="fName"><label for="inpName">Nombre completo</label><input id="inpName" placeholder="Ej. Ana Torres López" autocomplete="name"><div class="error">Ingresa nombre y apellidos</div></div>
      <div class="field" id="fEmail"><label for="inpEmail">Correo</label><input id="inpEmail" type="email" placeholder="ana@correo.com" autocomplete="email"><div class="error">Correo inválido</div></div>
      <div class="field" id="fPass"><label for="inpPass">Contraseña</label><input id="inpPass" type="password" placeholder="••••••••" autocomplete="current-password"><div class="error">Contraseña incorrecta</div></div>
      <div class="field"><label for="inpGroup">Grupo</label><select id="inpGroup"></select></div>
      <button class="btn" type="submit">Entrar a estudiar</button>
    </form>
  </div>
</section>

<!-- ==================== APLICACIÓN PRINCIPAL ==================== -->
<!-- Se muestra después de login. Contiene topbar, sidebar de cursos y área principal de temas. -->
<section id="app" class="hidden">
  <header class="topbar">
    <button class="brand-btn" id="btnToggleSidebar" aria-label="Menú">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="logo">A</div>
      <div class="brand-text"><strong>ADDISON</strong><span>academia virtual</span></div>
    </button>
    <button class="user-btn" id="btnAccount"><span id="userNameTop">Usuario</span></button>
  </header>
  <div class="app-body" id="appBody">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-title-wrap">
          <div class="sidebar-header">Mis cursos</div>
          <div class="sidebar-group" id="sidebarGroup"></div>
        </div>
        <div class="sidebar-overall" id="sidebarOverall"></div>
      </div>
      <nav id="courseList"></nav>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <main class="main"><div class="topics-grid" id="topicsGrid"></div></main>
  </div>
  <footer class="app-footer">
    <a href="https://wa.me/51900081858" target="_blank" rel="noopener">prepárate con los mejores - 9000 81 858</a>
  </footer>
</section>

<!-- ==================== MODAL DE CUENTA ==================== -->
<div id="modalAccount" class="modal hidden"><div class="modal-card"><h3>Cuenta</h3>
  <div class="field"><label>Nombre</label><input id="accName"></div>
  <div class="field"><label>Correo</label><input id="accEmail" disabled></div>
  <div class="field" id="accGroupField"><label>Grupo</label><select id="accGroup"></select><small id="accGroupHint" style="color:var(--muted);font-size:12px;display:block;margin-top:4px"></small></div>
  <div class="field"><label>Nueva contraseña</label><input id="accPass" type="password" placeholder="Dejar vacío para no cambiar"></div>
  <div class="modal-actions"><button id="btnSaveAccount" class="primary">Guardar</button><button id="btnLogout">Salir</button><button id="btnCloseAccount">Cerrar</button></div>
</div></div>

<!-- ==================== MODAL IFRAME PARA TEORÍA/EXAMEN ==================== -->
<div id="modalIframe" class="modal hidden iframe-modal"><div class="modal-card"><div class="iframe-head"><strong id="iframeTitle">Contenido</strong><button id="btnCloseIframe" class="btn" style="width:auto;padding:8px 12px">Cerrar</button></div><div class="iframe-body"><iframe id="iframeContent" src="about:blank"></iframe></div></div></div>









  <script src="js/platform.js"></script>
</body>
</html>
